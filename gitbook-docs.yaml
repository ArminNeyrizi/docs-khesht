$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: خشت | نظام مدیریت یکپارچه
  structure:
    - type: section
      key: section-1
      title: خانه IMS
      path: home
      description: درگاه اصلی نظام مدیریت یکپارچه خشت
      icon: house
      default: true
      children:
        - type: space
          key: space-1
          title: خانه IMS
          path: home
          default: true
          content:
            directory: ./home
            language: ar
    - type: section
      key: section-2
      title: نظام مدیریت یکپارچه
      path: documentation
      description: چارچوب، حاکمیت، فرایندها، شاخص‌ها، ریسک و خدمات مهندسی
      icon: sitemap
      children:
        - type: space
          key: space-2
          title: نظام مدیریت یکپارچه
          path: documentation
          default: true
          content:
            directory: ./documentation
            language: ar
    - type: section
      key: section-3
      title: مرجع فنی
      path: api-reference
      description: بخش نمونه قدیمی؛ از ناوبری عمومی پنهان می‌شود
      icon: terminal
      condition: "false"
      children:
        - type: space
          key: space-3
          title: مرجع فنی
          path: api-reference
          default: true
          hidden: true
          content:
            directory: ./api-reference
            language: ar
    - type: section
      key: section-4
      title: تاریخچه تغییرات
      path: changelog
      description: بخش نمونه قدیمی؛ از ناوبری عمومی پنهان می‌شود
      icon: clock-rotate-left
      condition: "false"
      children:
